[project]
name = "aitype"
version = "0.1.0"
description = "Types text like a human: variable speed, pauses, typos and corrections."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aitype = "aitype.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitype"]
